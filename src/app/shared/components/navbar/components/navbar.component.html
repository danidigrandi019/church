<nav class="navbar" [class.navbar-dark]="isDarkTheme">
  <div class="navbar-container">
    <div class="navbar-left">
      <app-logo></app-logo>
    </div>

    @if (isMobileMenuOpen) {
      <button
        type="button"
        class="mobile-menu-backdrop"
        (click)="closeMobileMenu()"
        aria-label="Fechar menu"
      ></button>
    }

    <ul class="navbar-menu" [class.active]="isMobileMenuOpen">
      <li class="mobile-menu-close-item">
        <button
          type="button"
          class="mobile-menu-close"
          (click)="closeMobileMenu()"
          aria-label="Fechar menu"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </li>

      <app-navbar-dropdown title="SOBRE NÓS" [items]="sobreNosItems" (itemClicked)="closeMobileMenu()">
      </app-navbar-dropdown>

      <app-navbar-dropdown title="AMBIENTES" [items]="ambientesItems" (itemClicked)="closeMobileMenu()">
      </app-navbar-dropdown>

      <li class="menu-item">
        <a routerLink="/events" class="menu-link" (click)="closeMobileMenu()">EVENTOS</a>
      </li>

      <li class="menu-item">
        <a href="https://www.youtube.com/@somoschurch_oficial" target="_blank" rel="noopener noreferrer" class="menu-link" (click)="closeMobileMenu()">
          ASSISTA ONLINE
        </a>
      </li>

      <li class="menu-item mobile-cta-item">
        <button class="contribua-btn mobile-cta" routerLink="/donate" (click)="closeMobileMenu()">CONTRIBUA</button>
      </li>
    </ul>

    <div class="navbar-right">
      <button class="contribua-btn desktop-cta" routerLink="/donate">CONTRIBUA</button>

      <button class="hamburger-menu" (click)="toggleMobileMenu()" [class.open]="isMobileMenuOpen"
        aria-label="Toggle navigation menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
    </div>
  </div>
</nav>
