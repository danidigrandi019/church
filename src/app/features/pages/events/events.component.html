<div class="events-page">
  <div class="events-container">

    <h1 class="page-title">Eventos</h1>

    <!-- Empty state -->
    <div class="empty-state" *ngIf="events.length === 0">
      <div class="empty-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </div>
      <p class="empty-text">Nenhum evento programado</p>
      <p class="empty-sub">Fique atento — em breve teremos novidades!</p>
    </div>

    <!-- Events grid -->
    <div class="events-grid" *ngIf="events.length > 0">
      <div class="event-card" *ngFor="let event of events">
        <div class="event-card__top-bar"></div>
        <div class="event-card__content">
          <div class="event-card__header">
            <span class="event-card__date">{{ event.date }}</span>
            <span class="event-card__time">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              {{ event.time }}
            </span>
          </div>
          <div class="event-card__divider"></div>
          <h2 class="event-card__title">{{ event.title }}</h2>
          <p class="event-card__description">{{ event.description }}</p>
        </div>
      </div>
    </div>

  </div>
</div>
